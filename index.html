<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bloc de Notas - Notificaciones</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        .card {
            background: white;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h1, h3 {
            margin-top: 0;
        }
        input, textarea {
            width: 100%;
            padding: 12px;
            margin-bottom: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
        }
        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            margin: 5px;
        }
        button:hover {
            background: #764ba2;
        }
        .btn-noti {
            background: #28a745;
        }
        .status {
            margin-top: 10px;
            padding: 10px;
            border-radius: 8px;
            font-size: 14px;
        }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .info { background: #d1ecf1; color: #0c5460; }
        .nota-card {
            background: #f9f9f9;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 10px;
        }
        .nota-titulo {
            font-weight: bold;
            margin-bottom: 5px;
        }
        .nota-contenido {
            color: #555;
            margin-bottom: 5px;
        }
        .nota-fecha {
            font-size: 11px;
            color: #999;
        }
        .btn-eliminar {
            background: #dc3545;
            padding: 5px 10px;
            font-size: 12px;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="card">
        <h1>📝 Bloc de Notas</h1>
        <p>Notas sincronizadas con GitHub | Notificaciones push</p>
    </div>

    <div class="card">
        <h3>⚙️ Configuración</h3>
        <input type="password" id="githubToken" placeholder="GitHub Token (ghp_...)">
        <input type="text" id="gistId" placeholder="ID del Gist (opcional)">
        <div style="display: flex; gap: 10px; flex-wrap: wrap;">
            <button onclick="guardarConfig()">💾 Guardar</button>
            <button onclick="cargarNotas()">📥 Cargar notas</button>
            <button onclick="guardarNotas()">📤 Subir notas</button>
            <button id="btnNoti" class="btn-noti">🔔 Activar notificaciones</button>
        </div>
        <div id="status" class="status info">✅ Listo</div>
    </div>

    <div class="card">
        <h3>✏️ Nueva nota</h3>
        <input type="text" id="titulo" placeholder="Título">
        <textarea id="contenido" rows="4" placeholder="Escribe tu nota aquí..."></textarea>
        <button onclick="agregarNota()">💾 Guardar nota</button>
    </div>

    <div class="card">
        <h3>📋 Mis notas</h3>
        <div id="notasLista"></div>
    </div>
</div>

<script>
    let notas = [];
    let config = { token: '', gistId: '' };

    // ============================================
    // FUNCIONES DEL BLOC DE NOTAS
    // ============================================

    function guardarConfig() {
        config.token = document.getElementById('githubToken').value;
        config.gistId = document.getElementById('gistId').value;
        if (config.token) localStorage.setItem('github_token', config.token);
        if (config.gistId) localStorage.setItem('gist_id', config.gistId);
        mostrarStatus('✅ Configuración guardada', 'success');
    }

    function cargarConfig() {
        const savedToken = localStorage.getItem('github_token');
        const savedGist = localStorage.getItem('gist_id');
        if (savedToken) {
            document.getElementById('githubToken').value = savedToken;
            config.token = savedToken;
        }
        if (savedGist) {
            document.getElementById('gistId').value = savedGist;
            config.gistId = savedGist;
        }
    }

    function agregarNota() {
        const titulo = document.getElementById('titulo').value;
        const contenido = document.getElementById('contenido').value;
        if (!titulo && !contenido) {
            mostrarStatus('❌ Escribe algo', 'error');
            return;
        }
        const nota = {
            id: Date.now(),
            titulo: titulo || 'Sin título',
            contenido: contenido,
            fecha: new Date().toLocaleString()
        };
        notas.unshift(nota);
        localStorage.setItem('notas', JSON.stringify(notas));
        document.getElementById('titulo').value = '';
        document.getElementById('contenido').value = '';
        mostrarNotas();
        mostrarStatus('✅ Nota guardada localmente', 'success');
        if (config.token && config.gistId) {
            guardarNotas();
        }
    }

    function mostrarNotas() {
        const container = document.getElementById('notasLista');
        if (notas.length === 0) {
            container.innerHTML = '<p style="text-align:center; color:#999;">No hay notas. ¡Crea una!</p>';
            return;
        }
        container.innerHTML = notas.map(nota => `
            <div class="nota-card">
                <div class="nota-titulo">${escapeHtml(nota.titulo)}</div>
                <div class="nota-contenido">${escapeHtml(nota.contenido).substring(0, 200)}${nota.contenido.length > 200 ? '...' : ''}</div>
                <div class="nota-fecha">📅 ${nota.fecha}</div>
                <button class="btn-eliminar" onclick="eliminarNota(${nota.id})">🗑️ Eliminar</button>
            </div>
        `).join('');
    }

    function eliminarNota(id) {
        if (confirm('¿Eliminar esta nota?')) {
            notas = notas.filter(n => n.id !== id);
            localStorage.setItem('notas', JSON.stringify(notas));
            mostrarNotas();
            mostrarStatus('🗑️ Nota eliminada', 'info');
            if (config.token && config.gistId) guardarNotas();
        }
    }

    async function guardarNotas() {
        if (!config.token || !config.gistId) {
            mostrarStatus('⚠️ Configura GitHub primero', 'error');
            return;
        }
        mostrarStatus('📤 Subiendo a GitHub...', 'info');
        try {
            const data = { files: { 'notas.json': { content: JSON.stringify(notas, null, 2) } } };
            const response = await fetch(`https://api.github.com/gists/${config.gistId}`, {
                method: 'PATCH',
                headers: {
                    'Authorization': `token ${config.token}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(data)
            });
            if (response.ok) {
                mostrarStatus('✅ Notas subidas a GitHub', 'success');
            } else {
                throw new Error('Error al subir');
            }
        } catch (error) {
            mostrarStatus('❌ Error al subir', 'error');
        }
    }

    async function cargarNotas() {
        if (!config.token || !config.gistId) {
            mostrarStatus('⚠️ Configura GitHub primero', 'error');
            return;
        }
        mostrarStatus('📥 Cargando desde GitHub...', 'info');
        try {
            const response = await fetch(`https://api.github.com/gists/${config.gistId}`, {
                headers: { 'Authorization': `token ${config.token}` }
            });
            if (response.ok) {
                const gist = await response.json();
                const content = gist.files['notas.json']?.content;
                if (content) {
                    notas = JSON.parse(content);
                    localStorage.setItem('notas', JSON.stringify(notas));
                    mostrarNotas();
                    mostrarStatus('✅ Notas cargadas desde GitHub', 'success');
                }
            } else {
                throw new Error('Error al cargar');
            }
        } catch (error) {
            mostrarStatus('❌ Error al cargar', 'error');
        }
    }

    function mostrarStatus(msg, tipo) {
        const statusDiv = document.getElementById('status');
        statusDiv.textContent = msg;
        statusDiv.className = `status ${tipo}`;
        setTimeout(() => {
            if (statusDiv.textContent === msg) {
                statusDiv.className = 'status info';
                statusDiv.textContent = '✅ Listo';
            }
        }, 3000);
    }

    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    // Cargar notas guardadas
    const savedNotas = localStorage.getItem('notas');
    if (savedNotas) {
        notas = JSON.parse(savedNotas);
        mostrarNotas();
    }
    cargarConfig();

    // ============================================
    // NOTIFICACIONES FIREBASE (VERSIÓN CORREGIDA)
    // ============================================

    const firebaseConfig = {
        apiKey: "AIzaSyBowQFEXv4_1Pu9ssR1fLdgsvevdbIhN4M",
        authDomain: "ciau-5d2b2.firebaseapp.com",
        projectId: "ciau-5d2b2",
        storageBucket: "ciau-5d2b2.firebasestorage.app",
        messagingSenderId: "288289997943",
        appId: "1:288289997943:web:cdea93ad690620247c3272"
    };

    const VAPID_KEY = "BFbdhILmpwEelCC0Pp2vcOMGwXFVTB-95Pv2nsCc90mDFs1GL-k4W3QY-zrVddlTE8VKNjvwrmNkn-THPLhLG0k";

    async function activarNotificaciones() {
        try {
            // PASO 1: Registrar Service Worker MANUALMENTE con la ruta correcta
            console.log('Registrando Service Worker...');
            const registration = await navigator.serviceWorker.register('/firebase-messaging-sw.js');
            console.log('✅ Service Worker registrado:', registration);
            
            // PASO 2: Importar Firebase
            const { initializeApp } = await import('https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js');
            const { getMessaging, getToken } = await import('https://www.gstatic.com/firebasejs/12.12.1/firebase-messaging.js');
            
            const app = initializeApp(firebaseConfig);
            const messaging = getMessaging(app);
            
            // PASO 3: Pedir permiso
            const permiso = await Notification.requestPermission();
            if (permiso !== 'granted') {
                mostrarStatus('❌ Permiso denegado. Actívalo desde ajustes.', 'error');
                return;
            }
            
            // PASO 4: Obtener token usando el Service Worker que registramos
            const token = await getToken(messaging, { 
                vapidKey: VAPID_KEY,
                serviceWorkerRegistration: registration  // <-- CLAVE: usar el SW que registramos
            });
            
            console.log('✅ TOKEN FCM:', token);
            mostrarStatus('✅ Notificaciones activadas. Token: ' + token.substring(0, 20) + '...', 'success');
            localStorage.setItem('fcm_token', token);
            
            // Cambiar botón
            const btn = document.getElementById('btnNoti');
            btn.textContent = '✅ Notificaciones activadas';
            btn.style.background = '#6c757d';
            btn.disabled = true;
            
        } catch (error) {
            console.error('Error:', error);
            mostrarStatus('❌ Error: ' + error.message, 'error');
        }
    }

    // Registrar Service Worker al cargar la página (opcional, pero bueno para tenerlo listo)
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/firebase-messaging-sw.js')
            .then(reg => console.log('✅ Service Worker registrado (carga inicial)', reg))
            .catch(err => console.log('❌ Service Worker error:', err));
    }

    // Configurar botón
    document.getElementById('btnNoti').onclick = activarNotificaciones;
</script>
</body>
</html>
